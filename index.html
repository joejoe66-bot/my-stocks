<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的股票</title>
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1516" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的股票">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f5f3; --card:#ffffff; --ink:#10282b; --muted:#5f7579; --faint:#8a9da0; --line:#e1e9e7;
  --hero:#0f3b3b; --hero2:#155251; --heroInk:#eaf6f3; --heroMuted:#9cc3bd;
  --up:#138a5e; --upbg:#e3f4ec; --down:#cf3f3b; --downbg:#fbe9e8;
  --live:#e07a10; --accent:#0f3b3b; --glass:rgba(255,255,255,.78);
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --shadow:0 1px 1px rgba(16,40,43,.04),0 8px 24px -12px rgba(16,40,43,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0b1516; --card:#132123; --ink:#e4efed; --muted:#93aaa9; --faint:#6c8383; --line:#203436;
    --hero:#0f4644; --hero2:#135955; --heroInk:#eefaf7; --heroMuted:#a6d0c9;
    --up:#34c08a; --upbg:rgba(52,192,138,.14); --down:#f06b62; --downbg:rgba(240,107,98,.14);
    --live:#fb9a3c; --accent:#5fd0b6; --glass:rgba(19,33,35,.8); --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
.num{font-family:Manrope,-apple-system,BlinkMacSystemFont,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

/* 頂部 */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 2px 16px}
header h1{font-size:28px;margin:0;font-weight:800;letter-spacing:.01em}
.sub{color:var(--faint);font-size:12px;margin-top:2px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font-weight:800;font-size:13px;box-shadow:var(--shadow)}
.iconbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-bottom:12px}
.demo{background:#fff3df;color:#8a5200}
.offline{background:var(--downbg);color:var(--down)}
@media (prefers-color-scheme:dark){.demo{background:rgba(251,154,60,.14);color:#fbc58a}}

/* 總覽：主卡 */
.hero{background:var(--hero);color:var(--heroInk);border-radius:var(--r-lg);padding:22px 20px 20px;position:relative;overflow:hidden;
  display:grid;gap:22px}
.hero::before{content:'';position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(closest-side,var(--hero2),transparent);pointer-events:none}
@media(min-width:820px){.hero{grid-template-columns:1.15fr 1fr;padding:28px;gap:36px;align-items:end}}
.hero > *{position:relative}
.hlabel{font-size:13px;color:var(--heroMuted)}
.hvalue{font-size:clamp(38px,9vw,52px);font-weight:800;line-height:1.05;margin:4px 0 14px;letter-spacing:-.03em}
.hvalue .cur{font-size:.55em;font-weight:700;vertical-align:.55em;margin-right:2px;color:var(--heroMuted)}
.plchip{display:inline-flex;align-items:baseline;gap:8px;padding:7px 12px;border-radius:999px;font-weight:700;font-size:15px;background:rgba(255,255,255,.1)}
.plchip.up{background:rgba(52,192,138,.2);color:#b9f0d8}
.plchip.down{background:rgba(240,107,98,.22);color:#ffd2ce}
.plchip .t{font-family:inherit;font-weight:600;font-size:13px;opacity:.85}
.plchip .p{font-size:13px;opacity:.85}

/* 成本 vs 市值 長條 */
.bars{display:grid;gap:16px}
.blabel{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--heroMuted);margin-bottom:7px}
.blabel b{font-size:14px;color:var(--heroInk);font-weight:700}
.track{height:10px;border-radius:999px;background:rgba(255,255,255,.1);display:flex;overflow:hidden;gap:2px}
.track i{display:block;height:100%}
.seg-cost{background:rgba(255,255,255,.55)}
.seg-gain{background:#46d39b}
.seg-loss{background:repeating-linear-gradient(135deg,#f06b62 0 4px,rgba(240,107,98,.45) 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12px;color:var(--heroMuted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend b{color:var(--heroInk);font-weight:700}

/* 區塊標題 */
.shead-row{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.shead-row h2{font-size:19px;margin:0;font-weight:800}
.shead-row span{font-size:13px;color:var(--faint)}

/* 股票卡 */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.stock{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);overflow:hidden}
.hold{cursor:pointer;text-align:left;width:100%;padding:0;color:inherit}
.stop{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0;background:var(--c);letter-spacing:.02em}
.sname{flex:1;min-width:0}
.sname b{display:block;font-size:17px;font-weight:800}
.sname span{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprice{text-align:right;flex-shrink:0}
.sprice b{display:block;font-size:21px;font-weight:800;line-height:1.1}
.live-l{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--live);margin-top:3px}
.live{width:7px;height:7px;border-radius:50%;background:#22c55e;position:relative;display:inline-block}
.live::after{content:'';position:absolute;inset:0;border-radius:50%;background:#22c55e;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(2.8);opacity:0}}
.noq{font-size:12px;color:var(--faint)}
.plrow{margin:0 16px;display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;border-radius:var(--r-sm);font-size:13px}
.plrow b{font-size:16px;font-weight:800}
.plrow small{font-size:12px;font-weight:700;margin-left:4px}
.up{color:var(--up)} .down{color:var(--down)}
.bg-up{background:var(--upbg);color:var(--up)} .bg-down{background:var(--downbg);color:var(--down)} .bg-flat{background:var(--paper);color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:14px 16px 16px}
.facts span{display:block;font-size:12px;color:var(--faint);margin-bottom:1px}
.facts b{font-size:15px;font-weight:700}
.facts .live-l{display:flex;margin:0 0 1px;color:var(--live)}

/* 交易紀錄 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.chip.on{background:var(--ink);color:var(--paper)}
.tgroups{display:grid;gap:14px}
@media(min-width:900px){.tgroups{grid-template-columns:1fr 1fr;align-items:start}}
.trows{border-top:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px;color:var(--ink);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:active{background:var(--paper)}
.tdot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:16px}
.tmid{flex:1;min-width:0}
.tmid b{display:block;font-size:15px;font-weight:700}
.tmid span{font-size:12px;color:var(--faint)}
.tamt{text-align:right;font-size:15px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:44px 16px;background:var(--card);border-radius:var(--r-md)}

/* 浮動底部導航（iOS 風格） */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:20}
.tabbar{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);box-shadow:0 10px 30px -10px rgba(16,40,43,.35);border:1px solid var(--line)}
.tabbar button{border:0;background:none;color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;padding:11px 16px;white-space:nowrap;border-radius:999px;cursor:pointer}
.tabbar button.on{background:var(--ink);color:var(--paper)}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--live);color:#fff;box-shadow:0 10px 24px -6px rgba(224,122,16,.55);cursor:pointer;display:grid;place-items:center}

/* 表格 */
.overlay{position:fixed;inset:0;background:rgba(9,25,26,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:31;max-height:92vh;overflow:auto}
.sheet.show{transform:none}
@media(min-width:760px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:520px;margin:0;border-radius:26px;padding:20px 24px 24px;transform:translate(-50%,-44%);opacity:0;pointer-events:none;transition:.22s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){.sheet,.overlay{transition:none}.live::after{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h3{margin:0;font-size:20px;font-weight:800}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}
input{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid transparent;border-radius:var(--r-sm);padding:12px;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
input:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:var(--r-sm);padding:4px;margin-top:12px}
.seg button{border:0;background:none;padding:11px;border-radius:9px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button.on[data-v=Buy]{background:var(--up);color:#fff}
.seg button.on[data-v=Sell]{background:var(--down);color:#fff}
.preview{margin-top:14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--paper);display:grid;gap:6px}
.preview div{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.preview b{font-size:17px;font-weight:800}
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
.primary{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;background:var(--ink);color:var(--paper);cursor:pointer}
.primary:disabled{opacity:.6}
.danger{width:100%;margin-top:6px;border:0;background:none;color:var(--down);font-weight:700;padding:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.22s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:220px;border-radius:var(--r-lg);background:var(--card)}
.login{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;padding:24px}
.login .box{width:100%;max-width:420px;padding:26px;position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.login .lang{position:absolute;top:16px;right:16px;box-shadow:none;background:var(--paper)}
.login .logo{width:60px;height:60px;border-radius:16px;margin-bottom:14px}
.login h3{margin:0 0 6px;font-size:22px;font-weight:800}
.login p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.login .err{color:var(--down);font-size:13px;margin-top:8px;min-height:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 data-i="title">我的股票</h1><div class="sub" id="upd"></div></div>
    <div class="hbtns">
      <button class="iconbtn lang" onclick="toggleLang()" data-ia="langLabel"></button>
      <button class="iconbtn" onclick="logout()" data-ia="lockLabel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
      <button class="iconbtn" id="rf" onclick="load(true)" data-ia="refreshLabel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>
  <div class="note offline" id="offline" data-i="offline" hidden></div>
  <div class="note demo" id="demo" data-i="demo" hidden></div>
  <section id="v_home"><div class="skel"></div></section>
  <section id="v_trades" hidden></section>
</div>

<div class="dock">
  <nav class="tabbar">
    <button data-tab="home" class="on" onclick="go('home')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span data-i="tabHome"></span></button>
    <button data-tab="trades" onclick="go('trades')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span data-i="tabTrades"></span></button>
  </nav>
  <button class="fab" onclick="openForm()" data-ia="formNew">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div class="overlay" id="ov" onclick="closeForm()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head"><h3 id="ftitle"></h3>
    <button class="iconbtn" style="width:36px;height:36px;box-shadow:none;background:var(--paper)" onclick="closeForm()" data-ia="close">✕</button></div>
  <div class="seg" id="seg"><button data-v="Buy" class="on" data-i="buy"></button><button data-v="Sell" data-i="sell"></button></div>
  <label><span data-i="ticker"></span><input id="f_ticker" list="tklist" autocapitalize="characters" autocomplete="off" data-ip="tickerPh"></label>
  <datalist id="tklist"></datalist>
  <div class="two">
    <label><span data-i="date"></span><input id="f_date" type="date"></label>
    <label><span data-i="qty"></span><input id="f_shares" type="number" inputmode="decimal" step="any" placeholder="50"></label>
  </div>
  <div class="two">
    <label><span data-i="priceL"></span><input id="f_price" type="number" inputmode="decimal" step="any" placeholder="0.00"></label>
    <label><span data-i="feeL"></span><input id="f_fee" type="number" inputmode="decimal" step="any" placeholder="7.50"></label>
  </div>
  <label><span data-i="note"></span><input id="f_note" data-ip="optional"></label>
  <div class="preview">
    <div><span data-i="amount"></span><b class="num" id="f_amt">$0.00</b></div>
    <div style="color:var(--muted)"><span data-i="fee"></span><span class="num" id="f_feev">$0.00</span></div>
  </div>
  <div class="hint" id="f_hint"></div>
  <button class="primary" id="f_save" onclick="saveForm()" data-i="save"></button>
  <button class="danger" id="f_del" onclick="delTrade()" data-i="del" hidden></button>
</div>
<div class="toast" id="toast"></div>
<div class="login" id="login" hidden>
  <div class="box">
    <button class="iconbtn lang" onclick="toggleLang()" data-ia="langLabel"></button>
    <img class="logo" src="icon-192.png" alt="">
    <h3 data-i="title"></h3>
    <p data-i="loginText"></p>
    <label><span data-i="pwd"></span><input id="tok" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false"></label>
    <div class="err" id="tokerr"></div>
    <button class="primary" id="tokbtn" onclick="saveToken()" data-i="loginBtn"></button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const API_URL = 'https://script.google.com/macros/s/AKfycbzTKX4ZE5YhpQ4UaPPrdi5UUcQyt0NymYa8B7YXh-YImxyKSCIr4v3mgxueQGn7UnVAEg/exec';
const DEMO_MODE = new URLSearchParams(location.search).has('demo');
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
             del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const PAL = ['#2a7f8f','#7b5ea7','#d98324','#3466c2','#c2416b','#2e9b6e','#8a6d3b','#5b6b8c'];
let S = {trades:[], prices:{}}, tab = 'home', filter = 'ALL', editing = null, ftype = 'Buy', busy = false;

/* ---------- 中英文 ---------- */
const I18N = {
  zh: {
    title:'我的股票', updated:'更新於 {t}，股價約延遲 15–20 分鐘',
    offline:'連唔到伺服器，顯示緊上次嘅資料。', demo:'示範模式：顯示緊示範數據，唔會影響你嘅真實紀錄。',
    mvTotal:'總市值', cost:'總成本', realized:'已實現盈虧', fees:'總佣金', fee:'佣金', costVsValue:'成本對比市值',
    alloc:'資產分佈', gainL:'賺咗', lossL:'蝕咗', holdings:'持倉', nStocks:'{n} 隻股票', shares:'持股', avg:'平均成本', mv:'市值',
    unreal:'盈虧', nowPrice:'即時股價', delayNote:'股價約延遲 15–20 分鐘', noQuote:'未有報價', noHold:'目前冇持倉',
    empty:'未有任何紀錄<br><br>按 <b>＋</b> 新增第一筆交易', noRec:'未有紀錄',
    all:'全部', nTrade1:'1 次', nTrades:'{n} 次', nShares:'{n} 股', soldOut:'已全部賣出',
    buy:'買入', sell:'賣出', tabHome:'總覽', tabTrades:'交易紀錄',
    formNew:'新增交易', formEdit:'編輯交易', ticker:'股票代號', tickerPh:'例如 INTC', date:'日期', qty:'股數',

const nf = (v,a,b) => Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:a,maximumFractionDigits:b});
const money = v => (v < 0 ? '-' : '') + '$' + nf(v,2,2);
const signed = v => (v > 0.0049 ? '+' : v < -0.0049 ? '-' : '') + '$' + nf(v,2,2);
const pct = v => (v > 0.00005 ? '+' : '') + (v*100).toFixed(2) + '%';
const px = v => '$' + nf(v,2,4);
const sharesF = v => v.toLocaleString('en-US',{maximumFractionDigits:4});
const cls = v => v > 0.0049 ? 'up' : v < -0.0049 ? 'down' : '';
const bg = v => v > 0.0049 ? 'bg-up' : v < -0.0049 ? 'bg-down' : 'bg-flat';
const arrow = v => v > 0.0049 ? '▲' : v < -0.0049 ? '▼' : '';
const sym = t => String(t).split(':').pop();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dateF(s){ const [y,m,d] = s.split('-').map(Number); return d ? `${d} ${MON[m-1]} ${y}` : s; }
function today(){ const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function color(t){ const ks = [...new Set(S.trades.map(x => x.ticker))].sort(); const i = ks.indexOf(t); return PAL[(i < 0 ? 0 : i) % PAL.length]; }
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- 伺服器 ---------- */
async function call(fn, ...a){
  if (DEMO_MODE){ await new Promise(r => setTimeout(r, 300)); return demo(fn, ...a); }
  const token = LS.get('mystocks_token');
  if (!token){ showLogin(); throw Object.assign(new Error(T('needPwd')), {code:'AUTH'}); }
  const body = { token, action: fn };
  if (fn === 'getData') body.refresh = !!a[0];
  if (fn === 'saveTrade') body.trade = a[0];
  if (fn === 'deleteTrade') body.id = a[0];
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow' });
  const j = await res.json();
  if (!j.ok){
    if (j.error === 'BAD_TOKEN'){ LS.del('mystocks_token'); showLogin(T('badPwd')); throw Object.assign(new Error(T('badPwd')), {code:'AUTH'}); }
    throw new Error(j.error);
  }
  return j.data;
}
function setData(d){ S = d; if (!DEMO_MODE) LS.set('mystocks_cache', JSON.stringify(d)); render(); }
async function load(refresh){
  if (busy) return; busy = true; $('#rf').classList.add('spin');
  try { setData(await call('getData', !!refresh)); $('#offline').hidden = true; if (refresh) toast(T('refreshed')); }
  catch(e){
    if (e.code === 'AUTH') {}
    else if (e instanceof TypeError){ $('#offline').hidden = !S.trades.length; toast(T('netErr')); }
    else toast(T('err') + (e.message || e));
  }
  finally { busy = false; $('#rf').classList.remove('spin'); }
}

/* ---------- 計算（平均成本法；總成本唔計佣金，佣金另計） ---------- */
function compute(trades = S.trades){
  const H = {};
  const ts = [...trades].sort((a,b) => a.date.localeCompare(b.date) || String(a.createdAt).localeCompare(String(b.createdAt)));
  for (const t of ts){
    const h = H[t.ticker] || (H[t.ticker] = {ticker:t.ticker, shares:0, cost:0, realized:0, fees:0, count:0});
    h.count++; h.fees += t.fee;
    if (t.type === 'Sell'){
      const avg = h.shares > 0 ? h.cost / h.shares : 0, s = Math.min(t.shares, h.shares);
      h.realized += (t.price - avg) * s;
      h.cost -= avg * s; h.shares -= s;
      if (h.shares < 1e-9){ h.shares = 0; h.cost = 0; }
    } else { h.cost += t.price * t.shares; h.shares += t.shares; }
  }
  for (const h of Object.values(H)){
    const p = S.prices[h.ticker] || {};
    h.name = p.name || '';
    h.hasPrice = typeof p.price === 'number';
    h.price = p.price; h.avg = h.shares ? h.cost / h.shares : 0;
    h.mv = h.hasPrice ? h.shares * p.price : h.cost;
    h.pl = h.mv - h.cost; h.plPct = h.cost ? h.pl / h.cost : 0;
  }
  return H;
}

const liveTag = h => h.hasPrice
  ? `<span class="live-l" title="${T('delayNote')}"><i class="live"></i>${T('nowPrice')}</span>`
  : `<span class="noq">${T('noQuote')}</span>`;

function renderHome(H){
  const all = Object.values(H);
  const hs = all.filter(h => h.shares > 0).sort((a,b) => b.mv - a.mv);
  const tot = hs.reduce((a,h) => (a.mv += h.mv, a.cost += h.cost, a), {mv:0, cost:0});
  const realized = all.reduce((a,h) => a + h.realized, 0);
  const fees = all.reduce((a,h) => a + h.fees, 0);
  const pl = tot.mv - tot.cost, plPct = tot.cost ? pl / tot.cost : 0;

  if (!S.trades.length){
    $('#v_home').innerHTML = `<div class="empty">${T('empty')}</div>`; return;
  }
  // 成本 vs 市值 長條：灰色＝成本，綠色＝賺咗嘅部分，紅色斜紋＝蝕咗嘅部分
  const big = Math.max(tot.cost, tot.mv) || 1;
  const costW = Math.min(tot.cost, tot.mv) / big * 100, diffW = Math.abs(pl) / big * 100;
  const cvBar = pl >= 0
    ? `<i class="seg-cost" style="width:${costW}%"></i><i class="seg-gain" style="width:${diffW}%"></i>`
    : `<i class="seg-cost" style="width:${costW}%"></i><i class="seg-loss" style="width:${diffW}%"></i>`;
  const allocBar = hs.map(h => `<i style="width:${tot.mv ? h.mv/tot.mv*100 : 0}%;background:${color(h.ticker)}"></i>`).join('');
  const allocLegend = hs.map(h => `<span><i style="background:${color(h.ticker)}"></i><b>${esc(sym(h.ticker))}</b><span class="num">${tot.mv ? (h.mv/tot.mv*100).toFixed(1) : 0}%</span></span>`).join('');
  const hasRealized = Math.abs(realized) > 0.0049;

  const cards = hs.map(h => `<button class="stock hold" style="--c:${color(h.ticker)}" onclick="filter='${esc(h.ticker)}';go('trades')">
      <div class="stop">
        <div class="badge">${esc(sym(h.ticker))}</div>
        <div class="sname"><b>${esc(sym(h.ticker))}</b><span>${esc(h.name || '—')}</span></div>
        <div class="sprice"><b class="num">${h.hasPrice ? px(h.price) : '—'}</b>${liveTag(h)}</div>
      </div>
      <div class="plrow ${bg(h.pl)}"><span>${T('unreal')}</span><span><b class="num">${signed(h.pl)}</b><small class="num">${pct(h.plPct)}</small></span></div>
      <div class="facts">
        <div><span>${T('shares')}</span><b class="num">${sharesF(h.shares)}</b></div>
        <div><span>${T('avg')}</span><b class="num">${px(h.avg)}</b></div>
        <div><span>${T('mv')}</span><b class="num">${money(h.mv)}</b></div>
        <div><span>${T('cost')}</span><b class="num">${money(h.cost)}</b></div>
        <div><span>${T('fee')}</span><b class="num">${money(h.fees)}</b></div>
      </div>
    </button>`).join('');

  $('#v_home').innerHTML = `
    <div class="hero">
      <div>
        <div class="hlabel">${T('mvTotal')}</div>
        <div class="hvalue num">${money(tot.mv)}</div>
        <span class="plchip ${cls(pl)}"><span class="t">${T('unreal')}</span><span class="num">${arrow(pl)} ${signed(pl)}</span><span class="num p">${pct(plPct)}</span></span>
      </div>
      <div class="bars">
        <div>
          <div class="blabel"><span>${T('cost')} <b class="num">${money(tot.cost)}</b></span><span>${T('fees')} <b class="num">${money(fees)}</b></span></div>
          <div class="track" title="${T('costVsValue')}">${cvBar}</div>
          <div class="legend"><span><i style="background:rgba(255,255,255,.55)"></i>${T('cost')}</span><span><i style="background:${pl >= 0 ? '#46d39b' : '#f06b62'}"></i>${T(pl >= 0 ? 'gainL' : 'lossL')} <b class="num">${money(Math.abs(pl))}</b></span></div>
        </div>
        <div>
          <div class="blabel"><span>${T('alloc')}</span>${hasRealized ? `<span>${T('realized')} <b class="num">${signed(realized)}</b></span>` : ''}</div>
          <div class="track">${allocBar}</div>
          <div class="legend">${allocLegend}</div>
        </div>
      </div>
    </div>
    <div class="shead-row"><h2>${T('holdings')}</h2><span>${T('nStocks',{n:hs.length})}</span></div>
    <div class="grid">${cards || `<div class="empty">${T('noHold')}</div>`}</div>`;
}

function renderTrades(H){
  const tks = [...new Set(S.trades.map(t => t.ticker))].sort();
  if (filter !== 'ALL' && !tks.includes(filter)) filter = 'ALL';
  const chips = ['ALL', ...tks].map(k => `<button class="chip ${filter===k?'on':''}" onclick="filter='${esc(k)}';render()">${k==='ALL'?T('all'):esc(sym(k))}</button>`).join('');
  const show = filter === 'ALL' ? tks : [filter];
  const groups = show.map(k => {
    const h = H[k] || {shares:0, avg:0, cost:0, mv:0, pl:0, plPct:0, realized:0, fees:0, name:''};
    const list = S.trades.filter(t => t.ticker === k)
      .sort((a,b) => b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt)));
    const rows = list.map(t => {
      const sell = t.type === 'Sell';
      return `<button class="trow" onclick="openForm('${esc(t.id)}')">
        <div class="tdot ${sell?'bg-down':'bg-up'}">${sell?'−':'+'}</div>
        <div class="tmid"><b class="num">${T(sell?'sell':'buy')} ${T('nShares',{n:sharesF(t.shares)})} @ ${px(t.price)}</b>
          <span>${dateF(t.date)} · ${T('fee')} ${money(t.fee)}${t.note ? ' · ' + esc(t.note) : ''}</span></div>
        <div class="tamt num">${money(t.price*t.shares)}</div>
      </button>`;
    }).join('');
    const closed = h.shares <= 0;
    return `<section class="stock" style="--c:${color(k)}">
      <div class="stop">
        <div class="badge">${esc(sym(k))}</div>
        <div class="sname"><b>${esc(sym(k))}</b><span>${esc(h.name || '—')} · ${T(list.length === 1 ? 'nTrade1' : 'nTrades',{n:list.length})}</span></div>
        <div class="sprice"><b class="num">${T('nShares',{n:sharesF(h.shares)})}</b>${closed ? `<span class="noq">${T('soldOut')}</span>` : ''}</div>
      </div>
      ${closed
        ? `<div class="plrow ${bg(h.realized)}"><span>${T('realized')}</span><b class="num">${signed(h.realized)}</b></div>`
        : `<div class="plrow ${bg(h.pl)}"><span>${T('unreal')}</span><span><b class="num">${signed(h.pl)}</b><small class="num">${pct(h.plPct)}</small></span></div>`}
      <div class="facts">
        <div><span class="live-l" style="margin:0" title="${T('delayNote')}"><i class="live"></i>${T('nowPrice')}</span><b class="num">${h.hasPrice ? px(h.price) : '—'}</b></div>
        <div><span>${T('avg')}</span><b class="num">${px(h.avg)}</b></div>
        <div><span>${T('mv')}</span><b class="num">${money(h.mv)}</b></div>
        <div><span>${T('cost')}</span><b class="num">${money(h.cost)}</b></div>
        <div><span>${T('fee')}</span><b class="num">${money(h.fees)}</b></div>
      </div>
      <div class="trows">${rows}</div>
    </section>`;
  }).join('');
  $('#v_trades').innerHTML = `<div class="chips">${chips}</div><div class="tgroups">${groups || `<div class="empty">${T('noRec')}</div>`}</div>`;

    id: editing ? editing.id : '', type: ftype,
    ticker: $('#f_ticker').value.trim().toUpperCase(), date: $('#f_date').value,
    price: +$('#f_price').value, shares: +$('#f_shares').value,

  };

    if (a.id){ const i = DEMO.trades.findIndex(t => t.id === a.id); DEMO.trades[i] = {...DEMO.trades[i], ...a}; }
    else DEMO.trades.push({...a, id:'d'+Date.now(), createdAt:new Date().toISOString()});
    if (!DEMO.prices[a.ticker]) DEMO.prices[a.ticker] = {price:+(a.price*1.02).toFixed(2), prev:a.price, name:''};
  }
  if (fn === 'deleteTrade') DEMO.trades = DEMO.trades.filter(t => t.id !== a);
  return JSON.parse(JSON.stringify({...DEMO, updatedAt:new Date().toISOString(), demo:true}));
}
