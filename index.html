<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的股票</title>
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的股票">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f2f4f8;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e9f0;--bar:rgba(255,255,255,.88);
  --up:#16a34a;--down:#dc2626;--upbg:#e8f7ee;--downbg:#fdecec;
  --b1:#1e3a5f;--b2:#3b6e8f;--accent:#2563eb;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#131c2e;--ink:#e6ebf5;--muted:#8b97ad;--line:#22304a;--bar:rgba(19,28,46,.9);
  --upbg:rgba(22,163,74,.16);--downbg:rgba(220,38,38,.16);--shadow:none;--up:#22c55e;--down:#f87171}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 14px}
header h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font:inherit;font-weight:800;font-size:14px}
.iconbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.demo{background:#fff4dc;color:#8a5a00;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.offline{background:var(--downbg);color:var(--down);border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.hero{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.hero{grid-template-columns:1.5fr 1fr}}
.summary{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.summary .label{opacity:.75;font-size:13px}
.summary .big{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:4px 0 10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;font-size:14px;font-weight:700}
.summary .pill{background:rgba(255,255,255,.16);color:#fff}
.summary .pill.up{background:rgba(34,197,94,.28);color:#d9fbe5}
.summary .pill.down{background:rgba(239,68,68,.3);color:#ffe0e0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.stats span{display:block;font-size:12px;opacity:.72;margin-bottom:2px}
.stats b{font-size:16px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.ctitle{font-weight:700;margin-bottom:10px}
.alloc{display:flex;align-items:center;gap:18px}
.legend{flex:1;display:grid;gap:10px;font-size:14px}
.legend .row{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.muted{color:var(--muted)}
h2{font-size:18px;margin:26px 2px 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
/* 每隻股票用自己顏色嘅框 */
.stock{padding:0;overflow:hidden;border:2px solid var(--c)}
.shead{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--ct);border-bottom:1px solid var(--line)}
.hold{cursor:pointer}
.badge{min-width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;padding:0 6px;flex-shrink:0}
.sname{flex:1;min-width:0}.sname b{display:block;font-size:17px;font-weight:800}.sname span{display:block;font-size:12px;color:var(--muted)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sright{text-align:right;flex-shrink:0}
.sright b{display:block;font-size:20px;font-weight:800;line-height:1.15;margin-bottom:3px}
.sright span{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block;font-style:normal}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;padding:14px 16px}
.kv.k2{grid-template-columns:repeat(2,1fr)}
.kv span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.kv b{font-size:14px}
.kv small{font-size:11px}
.plbar span{white-space:nowrap}
.plbar{margin:0 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-radius:12px;font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}
.bg-up{background:var(--upbg);color:var(--up)}.bg-down{background:var(--downbg);color:var(--down)}.bg-flat{background:var(--bg);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tgroups{display:grid;gap:14px}
@media(min-width:900px){.tgroups{grid-template-columns:1fr 1fr;align-items:start}}
.trows{border-top:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;font:inherit;color:var(--ink);cursor:pointer}
.trow:last-child{border-bottom:0}
.tmid{flex:1;min-width:0}.tmid b{display:block;font-size:15px;margin-bottom:3px}.tmid span{font-size:12px;color:var(--muted)}
.tmid .tag{margin-right:6px;vertical-align:1px}
.tamt{text-align:right}.tamt b{font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:var(--bar);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);z-index:20}
.tabbar button{flex:0 1 200px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.38);z-index:21;cursor:pointer;display:grid;place-items:center}
@media(min-width:1140px){.fab{right:calc(50% - 540px)}}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:31;max-height:92vh;overflow:auto}
.sheet.show{transform:none}
@media(min-width:760px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:520px;margin:0;border-radius:24px;padding:18px 22px 22px;transform:translate(-50%,-44%);opacity:0;pointer-events:none;transition:.22s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h3{margin:0;font-size:20px}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:12px}
input{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-top:12px}
.seg button{border:0;background:none;padding:11px;border-radius:9px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on[data-v=Buy]{background:var(--up);color:#fff}
.seg button.on[data-v=Sell]{background:var(--down);color:#fff}
.preview{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);display:grid;gap:6px}
.preview div{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.preview b{font-size:16px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
.primary{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:16px;background:var(--accent);color:#fff;cursor:pointer}
.primary:disabled{opacity:.6}
.danger{width:100%;margin-top:6px;border:0;background:none;color:var(--down);font:inherit;font-weight:600;padding:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.22s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:180px;border-radius:22px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:420px;padding:24px;position:relative}
.login .lang{position:absolute;top:16px;right:16px}
.login .logo{width:64px;height:64px;border-radius:18px;margin-bottom:14px}
.login h3{margin:0 0 6px;font-size:22px}
.login p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.login .err{color:var(--down);font-size:13px;margin-top:8px;min-height:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 data-i="title">我的股票</h1><div class="sub" id="upd"></div></div>
    <div class="hbtns">
      <button class="iconbtn lang" onclick="toggleLang()" data-ia="langLabel"></button>
      <button class="iconbtn" onclick="logout()" data-ia="lockLabel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
      <button class="iconbtn" id="rf" onclick="load(true)" data-ia="refreshLabel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>
  <div class="offline" id="offline" data-i="offline" hidden></div>
  <div class="demo" id="demo" data-i="demo" hidden></div>
  <section id="v_home"><div class="skel"></div></section>
  <section id="v_trades" hidden></section>
</div>

<button class="fab" onclick="openForm()" data-ia="formNew">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar">
  <button data-tab="home" class="on" onclick="go('home')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span data-i="tabHome"></span></button>
  <button data-tab="trades" onclick="go('trades')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span data-i="tabTrades"></span></button>
</nav>

<div class="overlay" id="ov" onclick="closeForm()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head"><h3 id="ftitle"></h3>
    <button class="iconbtn" style="width:36px;height:36px" onclick="closeForm()" data-ia="close">✕</button></div>
  <div class="seg" id="seg"><button data-v="Buy" class="on" data-i="buy"></button><button data-v="Sell" data-i="sell"></button></div>
  <label><span data-i="ticker"></span><input id="f_ticker" list="tklist" autocapitalize="characters" autocomplete="off" data-ip="tickerPh"></label>
  <datalist id="tklist"></datalist>
  <div class="two">
    <label><span data-i="date"></span><input id="f_date" type="date"></label>
    <label><span data-i="qty"></span><input id="f_shares" type="number" inputmode="decimal" step="any" placeholder="50"></label>
  </div>
  <div class="two">
    <label><span data-i="priceL"></span><input id="f_price" type="number" inputmode="decimal" step="any" placeholder="0.00"></label>
    <label><span data-i="feeL"></span><input id="f_fee" type="number" inputmode="decimal" step="any" placeholder="7.50"></label>
  </div>
  <label><span data-i="note"></span><input id="f_note" data-ip="optional"></label>
  <div class="preview">
    <div><span data-i="amount"></span><b class="num" id="f_amt">$0.00</b></div>
    <div class="muted"><span data-i="fee"></span><span class="num" id="f_feev">$0.00</span></div>
  </div>
  <div class="hint" id="f_hint"></div>
  <button class="primary" id="f_save" onclick="saveForm()" data-i="save"></button>
  <button class="danger" id="f_del" onclick="delTrade()" data-i="del" hidden></button>
</div>
<div class="toast" id="toast"></div>
<div class="login" id="login" hidden>
  <div class="card">
    <button class="iconbtn lang" onclick="toggleLang()" data-ia="langLabel"></button>
    <img class="logo" src="icon-192.png" alt="">
    <h3 data-i="title"></h3>
    <p data-i="loginText"></p>
    <label><span data-i="pwd"></span><input id="tok" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false"></label>
    <div class="err" id="tokerr"></div>
    <button class="primary" id="tokbtn" onclick="saveToken()" data-i="loginBtn"></button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const API_URL = 'https://script.google.com/macros/s/AKfycbzTKX4ZE5YhpQ4UaPPrdi5UUcQyt0NymYa8B7YXh-YImxyKSCIr4v3mgxueQGn7UnVAEg/exec';
const DEMO_MODE = new URLSearchParams(location.search).has('demo');
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
             set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
             del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const PAL = ['#3d7a8a','#7d62a8','#e08a2e','#2f6fd6','#d0476b','#2a9d6f','#8a6d3b','#5b6b8c'];
let S = {trades:[], prices:{}}, tab = 'home', filter = 'ALL', editing = null, ftype = 'Buy', busy = false;

/* ---------- 中英文 ---------- */

let LANG = LS.get('mystocks_lang') === 'en' ? 'en' : 'zh';
function T(k, v){ let s = (I18N[LANG][k] ?? I18N.zh[k] ?? k); if (v) for (const x in v) s = s.replace('{'+x+'}', v[x]); return s; }
function applyLang(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-HK';
  document.title = T('title');
  document.querySelectorAll('[data-i]').forEach(e => e.innerHTML = T(e.dataset.i));
  document.querySelectorAll('[data-ip]').forEach(e => e.placeholder = T(e.dataset.ip));
  document.querySelectorAll('[data-ia]').forEach(e => e.setAttribute('aria-label', T(e.dataset.ia)));
  document.querySelectorAll('.lang').forEach(e => e.textContent = T('langBtn'));
  $('#ftitle').textContent = T(editing ? 'formEdit' : 'formNew');
}
function toggleLang(){ LANG = LANG === 'zh' ? 'en' : 'zh'; LS.set('mystocks_lang', LANG); applyLang(); render(); updPreview(); }

/* ---------- 格式 ---------- */
const nf = (v,a,b) => Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:a,maximumFractionDigits:b});
const money = v => (v < 0 ? '-' : '') + '$' + nf(v,2,2);
const signed = v => (v > 0.0049 ? '+' : v < -0.0049 ? '-' : '') + '$' + nf(v,2,2);
const pct = v => (v > 0.00005 ? '+' : '') + (v*100).toFixed(2) + '%';
const px = v => '$' + nf(v,2,4);
const sharesF = v => v.toLocaleString('en-US',{maximumFractionDigits:4});
const cls = v => v > 0.0049 ? 'up' : v < -0.0049 ? 'down' : '';
const bg = v => v > 0.0049 ? 'bg-up' : v < -0.0049 ? 'bg-down' : 'bg-flat';
const arrow = v => v > 0.0049 ? '▲' : v < -0.0049 ? '▼' : '';
const sym = t => String(t).split(':').pop();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dateF(s){ const [y,m,d] = s.split('-').map(Number); return d ? `${d} ${MON[m-1]} ${y}` : s; }
function today(){ const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function color(t){ const ks = [...new Set(S.trades.map(x => x.ticker))].sort(); const i = ks.indexOf(t); return PAL[(i < 0 ? 0 : i) % PAL.length]; }
const cvars = t => `--c:${color(t)};--ct:${color(t)}1f`;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- 伺服器 ---------- */
async function call(fn, ...a){
  if (DEMO_MODE){ await new Promise(r => setTimeout(r, 300)); return demo(fn, ...a); }
  const token = LS.get('mystocks_token');
  if (!token){ showLogin(); throw Object.assign(new Error(T('needPwd')), {code:'AUTH'}); }
  const body = { token, action: fn };
  if (fn === 'getData') body.refresh = !!a[0];
  if (fn === 'saveTrade') body.trade = a[0];
  if (fn === 'deleteTrade') body.id = a[0];
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow' });
  const j = await res.json();
  if (!j.ok){
    if (j.error === 'BAD_TOKEN'){ LS.del('mystocks_token'); showLogin(T('badPwd')); throw Object.assign(new Error(T('badPwd')), {code:'AUTH'}); }
    throw new Error(j.error);
  }
  return j.data;
}
function setData(d){ S = d; if (!DEMO_MODE) LS.set('mystocks_cache', JSON.stringify(d)); render(); }
async function load(refresh){
  if (busy) return; busy = true; $('#rf').classList.add('spin');
  try { setData(await call('getData', !!refresh)); $('#offline').hidden = true; if (refresh) toast(T('refreshed')); }
  catch(e){
    if (e.code === 'AUTH') {}
    else if (e instanceof TypeError){ $('#offline').hidden = !S.trades.length; toast(T('netErr')); }
    else toast(T('err') + (e.message || e));
  }
  finally { busy = false; $('#rf').classList.remove('spin'); }
}

/* ---------- 登入 ---------- */
function showLogin(msg){ $('#tokerr').textContent = msg || ''; $('#login').hidden = false; }
async function saveToken(){
  const v = $('#tok').value.trim();
  if (!v) return showLogin(T('needPwd'));
  LS.set('mystocks_token', v);
  const b = $('#tokbtn'); b.disabled = true; b.textContent = T('loggingIn');
  try { setData(await call('getData', true)); $('#login').hidden = true; $('#tok').value = ''; toast(T('loginOk')); }
  catch(e){ if (e.code !== 'AUTH') showLogin(T('connFail') + (e.message || e)); }
  finally { b.disabled = false; b.textContent = T('loginBtn'); }
}
function logout(){
  if (DEMO_MODE) return toast(T('demoMode'));
  if (!confirm(T('confirmLogout'))) return;
  LS.del('mystocks_token'); LS.del('mystocks_cache');
  S = {trades:[], prices:{}}; render(); showLogin();
}

/* ---------- 計算（平均成本法；總成本唔計佣金，佣金另計） ---------- */
function compute(trades = S.trades){
  const H = {};
  const ts = [...trades].sort((a,b) => a.date.localeCompare(b.date) || String(a.createdAt).localeCompare(String(b.createdAt)));
  for (const t of ts){
    const h = H[t.ticker] || (H[t.ticker] = {ticker:t.ticker, shares:0, cost:0, realized:0, fees:0, count:0});
    h.count++; h.fees += t.fee;
    if (t.type === 'Sell'){
      const avg = h.shares > 0 ? h.cost / h.shares : 0, s = Math.min(t.shares, h.shares);
      h.realized += (t.price - avg) * s;
      h.cost -= avg * s; h.shares -= s;
      if (h.shares < 1e-9){ h.shares = 0; h.cost = 0; }
    } else { h.cost += t.price * t.shares; h.shares += t.shares; }
  }
  for (const h of Object.values(H)){
    const p = S.prices[h.ticker] || {};
    h.name = p.name || '';
    h.hasPrice = typeof p.price === 'number';
    h.price = p.price; h.avg = h.shares ? h.cost / h.shares : 0;
    h.mv = h.hasPrice ? h.shares * p.price : h.cost;
    h.pl = h.mv - h.cost; h.plPct = h.cost ? h.pl / h.cost : 0;
    const hasPrev = h.hasPrice && typeof p.prev === 'number' && p.prev > 0;
    h.day = hasPrev ? h.shares * (p.price - p.prev) : 0;
    h.dayPct = hasPrev ? (p.price - p.prev) / p.prev : 0;
  }
  return H;
}

/* ---------- 畫面 ---------- */
function go(t){ tab = t; render(); window.scrollTo({top:0}); }
function render(){
  const H = compute();
  const u = S.updatedAt ? new Date(S.updatedAt).toLocaleTimeString(LANG === 'en' ? 'en-US' : 'zh-HK',{hour:'2-digit',minute:'2-digit'}) : '—';
  $('#upd').textContent = T('updated', {t:u});
  $('#demo').hidden = !S.demo;
  renderHome(H); renderTrades(H);
  $('#v_home').hidden = tab !== 'home'; $('#v_trades').hidden = tab !== 'trades';
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}

function donut(hs, total){
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const segs = hs.map(h => {
    const len = total ? h.mv / total * C : 0;
    const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${color(h.ticker)}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len; return s;
  }).join('');
  return `<svg viewBox="0 0 140 140" width="132" height="132" style="flex-shrink:0"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="18"/>${segs}
    <text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--muted)">${T('holdingsShort')}</text>
    <text x="70" y="86" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)">${hs.length}</text></svg>`;
}

function renderHome(H){
  const all = Object.values(H);
  const hs = all.filter(h => h.shares > 0).sort((a,b) => b.mv - a.mv);
  const tot = hs.reduce((a,h) => (a.mv += h.mv, a.cost += h.cost, a.day += h.day, a), {mv:0, cost:0, day:0});
  const realized = all.reduce((a,h) => a + h.realized, 0);
  const fees = all.reduce((a,h) => a + h.fees, 0);
  const pl = tot.mv - tot.cost, plPct = tot.cost ? pl / tot.cost : 0;
  const prevMv = tot.mv - tot.day, dayPct = prevMv ? tot.day / prevMv : 0;

  if (!S.trades.length){
    $('#v_home').innerHTML = `<div class="card empty">${T('empty')}</div>`; return;
  }
  const cards = hs.map(h => `<div class="card stock hold" style="${cvars(h.ticker)}" onclick="filter='${esc(h.ticker)}';go('trades')">
      <div class="shead">
        <div class="badge" style="background:${color(h.ticker)}">${esc(sym(h.ticker))}</div>
        <div class="sname"><b>${esc(sym(h.ticker))}</b><span class="ellip">${esc(h.name || '—')}</span></div>
        <div class="sright"><b class="num">${h.hasPrice ? px(h.price) : '—'}</b>
          ${h.hasPrice ? `<span>${T('nowPrice')}</span>` : `<span class="tag bg-flat">${T('noQuote')}</span>`}</div>
      </div>
      <div class="kv">
        <div><span>${T('shares')}</span><b class="num">${sharesF(h.shares)}</b></div>
        <div><span>${T('avg')}</span><b class="num">${px(h.avg)}</b></div>
        <div><span>${T('mv')}</span><b class="num">${money(h.mv)}</b></div>
        <div><span>${T('cost')}</span><b class="num">${money(h.cost)}</b></div>
        <div><span>${T('fee')}</span><b class="num">${money(h.fees)}</b></div>
      </div>
      <div class="plbar ${bg(h.pl)}"><span>${T('unreal')}</span><b class="num">${signed(h.pl)} (${pct(h.plPct)})</b></div>
    </div>`).join('');

  $('#v_home').innerHTML = `
    <div class="hero">
      <div class="summary">
        <div class="label">${T('mvTotal')}</div>
        <div class="big num">${money(tot.mv)}</div>
        <span class="pill ${cls(pl)} num">${arrow(pl)} ${signed(pl)} · ${pct(plPct)}</span>
        <div class="stats">
          <div><span>${T('cost')}</span><b class="num">${money(tot.cost)}</b></div>
          <div><span>${T('realized')}</span><b class="num">${signed(realized)}</b></div>
          <div><span>${T('fees')}</span><b class="num">${money(fees)}</b></div>
        </div>
      </div>
      <div class="card">
        <div class="ctitle">${T('alloc')}</div>
        <div class="alloc">${donut(hs, tot.mv)}
          <div class="legend">${hs.map(h => `<div class="row"><i class="dot" style="background:${color(h.ticker)}"></i><b>${esc(sym(h.ticker))}</b><span class="muted num" style="margin-left:auto">${tot.mv ? (h.mv/tot.mv*100).toFixed(1) : 0}%</span></div>`).join('') || '<span class="muted">—</span>'}</div>
        </div>
      </div>
    </div>
    <h2>${T('holdings')}</h2>
    <div class="grid">${cards || `<div class="card empty">${T('noHold')}</div>`}</div>`;
}

function renderTrades(H){
  const tks = [...new Set(S.trades.map(t => t.ticker))].sort();
  if (filter !== 'ALL' && !tks.includes(filter)) filter = 'ALL';
  const chips = ['ALL', ...tks].map(k => `<button class="chip ${filter===k?'on':''}" onclick="filter='${esc(k)}';render()">${k==='ALL'?T('all'):esc(sym(k))}</button>`).join('');
  const show = filter === 'ALL' ? tks : [filter];
  const groups = show.map(k => {
    const h = H[k] || {shares:0, avg:0, cost:0, mv:0, pl:0, plPct:0, realized:0, fees:0, name:''};
    const list = S.trades.filter(t => t.ticker === k)
      .sort((a,b) => b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt)));
    const rows = list.map(t => {
      const sell = t.type === 'Sell';
      return `<button class="trow" onclick="openForm('${esc(t.id)}')">
        <div class="tmid"><b class="num ${sell?'down':'up'}">${sell?'−':'+'}${T('nShares',{n:sharesF(t.shares)})} @ ${px(t.price)}</b>
          <span><i class="tag ${sell?'bg-down':'bg-up'}">${T(sell?'sell':'buy')}</i>${dateF(t.date)} · ${T('fee')} ${money(t.fee)}${t.note ? ' · ' + esc(t.note) : ''}</span></div>
        <div class="tamt"><b class="num">${money(t.price*t.shares)}</b></div>
      </button>`;
    }).join('');
    const closed = h.shares <= 0;
    return `<section class="card stock" style="${cvars(k)}">
      <div class="shead">
        <div class="badge" style="background:${color(k)}">${esc(sym(k))}</div>
        <div class="sname"><b>${esc(sym(k))}</b><span class="ellip">${esc(h.name || '—')} · ${T(list.length === 1 ? 'nTrade1' : 'nTrades',{n:list.length})}</span></div>
        <div class="sright"><b class="num">${T('nShares',{n:sharesF(h.shares)})}</b><span class="num">${closed ? T('soldOut') : T('avgCost',{p:px(h.avg)})}</span></div>
      </div>
      <div class="kv k2">
        <div><span>${T('cost')}</span><b class="num">${money(h.cost)}</b></div>
        <div><span>${T('fee')}</span><b class="num">${money(h.fees)}</b></div>
        <div><span>${T('mv')}</span><b class="num">${money(h.mv)}</b></div>
        ${closed
          ? `<div><span>${T('realized')}</span><b class="num ${cls(h.realized)}">${signed(h.realized)}</b></div>`
          : `<div><span>${T('unreal')}</span><b class="num ${cls(h.pl)}">${signed(h.pl)} <small>(${pct(h.plPct)})</small></b></div>`}
      </div>
      <div class="trows">${rows}</div>
    </section>`;
  }).join('');
  $('#v_trades').innerHTML = `<div class="chips">${chips}</div><div class="tgroups">${groups || `<div class="card empty">${T('noRec')}</div>`}</div>`;
}

/* ---------- 表格 ---------- */
function setType(v){ ftype = v; document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); updPreview(); }
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setType(b.dataset.v));
['#f_price','#f_shares','#f_fee','#f_ticker'].forEach(s => $(s).addEventListener('input', updPreview));

function lastFee(){
  const t = [...S.trades].sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)))[0];
  return t ? t.fee : 7.5;
}
function heldShares(ticker){
  const others = S.trades.filter(t => !editing || t.id !== editing.id);
  const h = compute(others)[ticker]; return h ? h.shares : 0;
}
function updPreview(){
  const p = +$('#f_price').value || 0, s = +$('#f_shares').value || 0, f = +$('#f_fee').value || 0;
  const sell = ftype === 'Sell';
  $('[data-i=amount]').textContent = T(sell ? 'proceeds' : 'amount');
  $('#f_amt').textContent = money(p*s);
  $('#f_feev').textContent = money(f);
  const tk = $('#f_ticker').value.trim().toUpperCase();
  $('#f_hint').textContent = sell && tk ? T('held',{n:sharesF(heldShares(tk))}) : '';
}
function openForm(id){
  editing = id ? S.trades.find(t => t.id === id) : null;
  const t = editing || {type:'Buy', ticker: filter !== 'ALL' ? filter : '', date: today(), price:'', shares:'', fee: lastFee(), note:''};
  $('#ftitle').textContent = T(editing ? 'formEdit' : 'formNew');
  $('#f_ticker').value = t.ticker; $('#f_date').value = t.date; $('#f_price').value = t.price;
  $('#f_shares').value = t.shares; $('#f_fee').value = t.fee; $('#f_note').value = t.note || '';
  $('#tklist').innerHTML = [...new Set(S.trades.map(x => x.ticker))].map(k => `<option value="${esc(k)}">`).join('');
  $('#f_del').hidden = !editing;
  setType(t.type);
  $('#ov').classList.add('show'); $('#sheet').classList.add('show');
}
function closeForm(){ $('#ov').classList.remove('show'); $('#sheet').classList.remove('show'); }

async function saveForm(){
  const t = {
    id: editing ? editing.id : '', type: ftype,
    ticker: $('#f_ticker').value.trim().toUpperCase(), date: $('#f_date').value,
    price: +$('#f_price').value, shares: +$('#f_shares').value,
    fee: +($('#f_fee').value || 0), note: $('#f_note').value.trim()
  };
  if (!t.ticker) return toast(T('needTicker'));
  if (!t.date) return toast(T('needDate'));
  if (!(t.price > 0)) return toast(T('needPrice'));
  if (!(t.shares > 0)) return toast(T('needQty'));
  if (t.type === 'Sell'){ const held = heldShares(t.ticker); if (t.shares > held + 1e-9) return toast(T('tooMany',{n:sharesF(held)})); }
  const b = $('#f_save'); b.disabled = true; b.textContent = T('saving');
  try { setData(await call('saveTrade', t)); closeForm(); toast(T('saved')); }
  catch(e){ if (e.code !== 'AUTH') toast(T('saveFail') + (e.message || e)); }
  finally { b.disabled = false; b.textContent = T('save'); }
}
async function delTrade(){
  if (!editing || !confirm(T('confirmDel'))) return;
  try { setData(await call('deleteTrade', editing.id)); closeForm(); toast(T('deleted')); }
  catch(e){ if (e.code !== 'AUTH') toast(T('delFail') + (e.message || e)); }
}

/* ---------- 示範數據 ---------- */
const DEMO = {
  trades: [
    {id:'d1',date:'2026-10-20',ticker:'INTC',type:'Buy',price:89,shares:50,fee:7.5,note:'',createdAt:'2026-10-20T01'},
    {id:'d2',date:'2026-10-26',ticker:'INTC',type:'Buy',price:92,shares:50,fee:7.5,note:'',createdAt:'2026-10-26T01'},
    {id:'d3',date:'2026-10-20',ticker:'SPYM',type:'Buy',price:90,shares:50,fee:7.5,note:'',createdAt:'2026-10-20T02'},
    {id:'d4',date:'2026-10-27',ticker:'SPYM',type:'Buy',price:90.69,shares:50,fee:7.5,note:'',createdAt:'2026-10-27T01'}
  ],
  prices: { INTC:{price:93.4,prev:92.1,name:'Intel Corporation'}, SPYM:{price:90.2,prev:90.55,name:'SPDR Portfolio S&P 500 ETF'} }
};
function demo(fn, a){
  if (fn === 'saveTrade'){
    if (a.id){ const i = DEMO.trades.findIndex(t => t.id === a.id); DEMO.trades[i] = {...DEMO.trades[i], ...a}; }
    else DEMO.trades.push({...a, id:'d'+Date.now(), createdAt:new Date().toISOString()});
    if (!DEMO.prices[a.ticker]) DEMO.prices[a.ticker] = {price:+(a.price*1.02).toFixed(2), prev:a.price, name:''};
  }
  if (fn === 'deleteTrade') DEMO.trades = DEMO.trades.filter(t => t.id !== a);
  return JSON.parse(JSON.stringify({...DEMO, updatedAt:new Date().toISOString(), demo:true}));
}

/* ---------- 啟動 ---------- */
(function start(){
  applyLang();
  const cached = LS.get('mystocks_cache');
  if (!DEMO_MODE && cached){ try { S = JSON.parse(cached); render(); } catch(e){} }
  if (!DEMO_MODE && !LS.get('mystocks_token')){ render(); showLogin(); }
  else load(false);
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#login').hidden) load(false); });
setInterval(() => { if (!document.hidden && $('#login').hidden) load(false); }, 120000);
$('#tok').addEventListener('keydown', e => { if (e.key === 'Enter') saveToken(); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
